<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 78" width="280" height="78" role="img" aria-label="Kaggle: balarajr">
<defs><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.25"><stop offset="0.3" stop-color="#fbad74" stop-opacity="0"/><stop offset="0.5" stop-color="#fbad74" stop-opacity="0.13"/><stop offset="0.7" stop-color="#fbad74" stop-opacity="0"/></linearGradient></defs><style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
.card { opacity: 0; animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.frame { fill: #141110; stroke: #292524; }
.glow { fill: none; stroke: #f76616; opacity: 0.2; animation: glow 4s ease-in-out infinite; }
.bar { fill: #f76616; transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.icon { fill: none; stroke: #f76616; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tag { fill: #fbad74; font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px; }
.title { fill: #faf7f2; font-weight: 700; }
.sub { fill: #a8a29e; }
.shine { fill: url(#sheen); transform: translateX(-140%); animation: sweep 6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes grow { to { transform: scaleX(1); } }
@keyframes glow { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.8; } }
@keyframes sweep { 0%, 62% { transform: translateX(-140%); } 100% { transform: translateX(140%); } }
@media (prefers-reduced-motion: reduce) { .card { opacity: 1; animation: none; } .bar { transform: none; animation: none; } .glow, .shine { animation: none; } .shine { display: none; } }
</style>
<clipPath id="clip0"><rect x="1" y="1" width="278" height="76" rx="12"/></clipPath>
<g class="card" style="animation-delay:0.70s">
<rect class="frame" x="1" y="1" width="278" height="76" rx="12"/>
<rect class="glow" x="1" y="1" width="278" height="76" rx="12" style="animation-delay:3.0s"/>
<g clip-path="url(#clip0)"><rect class="bar" x="1" y="1" width="278" height="3" style="animation-delay:0.90s"/>
<g class="icon" transform="translate(18 22) scale(1.3333333333333333)"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text class="title" x="66" y="35" font-size="15">Kaggle</text><text class="sub" x="66" y="56" font-size="12.5">balarajr</text><g class="icon" transform="translate(242 28) scale(0.8333333333333334)"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></g>
