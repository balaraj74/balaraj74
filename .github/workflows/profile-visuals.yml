name: Generate profile visuals

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-visuals.yml'
      - '.github/profile-3d.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-snake.svg?palette=github-dark&color_snake=#f76616&color_dots=#1c1917,#7c2d12,#c2410c,#f76616,#fbbf24

      - name: Publish to the output branch
        run: |
          sudo cp profile-3d-contrib/ember.svg dist/ember.svg
          cd dist
          sudo chown -R "$USER" .
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: regenerate profile visuals"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
